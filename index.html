
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friendship Compatibility 🤝</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-glow"></div>

  <main class="container">
    <div class="logo">💗</div>
    <p class="eyebrow">THE FRIENDSHIP LAB</p>

    <h1>Friendship <span>Test</span></h1>
    <p class="subtitle">
      Best friends? Partners in crime? Let's find out! 😂
    </p>

    <section class="form-card">
      <label for="name1">YOUR NAME</label>
      <input id="name1" type="text" maxlength="30"
        placeholder="Enter your name">

      <div class="heart-divider">💞</div>

      <label for="name2">YOUR FRIEND'S NAME</label>
      <input id="name2" type="text" maxlength="30"
        placeholder="Enter your friend's name">

      <button id="testBtn" onclick="testFriendship()">
        Test Our Friendship ✨
      </button>

      <p class="small-text">Warning: Friendship may be roasted 💀</p>
    </section>

    <section id="result" class="result-card hidden"
      aria-live="polite">
      <div id="resultEmoji" class="result-emoji">💖</div>
      <p class="eyebrow">YOUR COMPATIBILITY</p>

      <div class="score">
        <span id="percentage">0</span><span>%</span>
      </div>

      <div class="progress-track">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <h2 id="resultTitle">Partners in chaos!</h2>
      <p id="resultMessage"></p>

      <button class="again-btn" onclick="resetTest()">
        Try Again 🔄
      </button>
      <button class="share-btn" onclick="shareResult()">
        Share Result 📲
      </button>
    </section>

    <footer>Made with 💗 and a little bit of trolling.</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
